<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete</title>
    <link rel="stylesheet" href="style.css">

     <style>
        /* --- Reset & Variáveis Modernas --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-card: #f3f3f3;
            --text-main: #111111;
            --text-muted: #5f5f5f;
            --accent-color: #e60023; /* Vermelho Pinterest */
            --accent-hover: #ad0018;
            --radius-card: 20px;
            --radius-btn: 50px;
        }

        /* Suporte ao Modo Escuro Automático do Sistema */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #111111;
                --bg-card: #262626;
                --text-main: #ffffff;
                --text-muted: #b5b5b5;
            }
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 40px 24px;
        }

        /* --- Bloco Centralizado de Boas-Vindas --- */
        .card-boas-vindas {
            text-align: center;
            max-width: 600px;
            margin: 0 auto 50px auto;
            padding: 30px;
        }

        .card-boas-vindas h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        .card-boas-vindas h1 span {
            color: var(--accent-color);
        }

        .card-boas-vindas p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-sair {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: var(--radius-btn);
            font-weight: 600;
            font-size: 1rem;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-sair:hover {
            background-color: var(--accent-hover);
            transform: scale(1.02);
        }

        /* --- Seção de Título dos Registros --- */
        .secao-titulo {
            max-width: 1400px;
            margin: 0 auto 20px auto;
            font-size: 1.3rem;
            font-weight: 700;
            padding-left: 8px;
        }

        /* --- Grid Cascata (Masonry) do Pinterest --- */
        .pinterest-grid {
            columns: 5 240px; /* Cria colunas dinâmicas conforme a largura da tela */
            column-gap: 16px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* --- Card do Usuário (O Pin) --- */
        .user-pin-card {
            break-inside: avoid; /* Não deixa o card quebrar entre colunas */
            margin-bottom: 20px;
            background-color: var(--bg-card);
            border-radius: var(--radius-card);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .user-pin-card:hover {
            transform: scale(1.02);
        }

        /* Área Visual (Foto/Fundo) do Card */
        .pin-visual {
            position: relative;
            width: 100%;
            overflow: hidden;
            display: block;
        }

        /* Alturas alternadas simuladas por bloco de imagem proporcional */
        .pin-visual img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: brightness(0.95);
        }

        /* Camada com botões flutuantes ao passar o mouse */
        .pin-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 100%);
            opacity: 0;
            transition: opacity 0.25s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        .user-pin-card:hover .pin-overlay {
            opacity: 1;
        }

        .btn-pin-editar {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: var(--radius-btn);
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .btn-pin-editar:hover {
            background-color: var(--accent-hover);
        }

        .pin-id-tag {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            font-weight: 500;
        }

        /* Detalhes de Texto abaixo da Imagem */
        .pin-info {
            padding: 12px 14px;
        }

        .pin-user-name {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pin-user-meta {
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .pin-user-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>

        <p style="font-size: 13px; color: #5f5f5f;">Dica: Você também pode usar a busca acima para conferir os dados antes de deletar.</p>

        <label for="deletarCPF">CPF:</label>
        <input type="text" id="deletarCPF" placeholder="Digite o CPF para excluir">
        
        <button  onclick="deletarDados()" value="Deletar">Deletar</button>

</html>
